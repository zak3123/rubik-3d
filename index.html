<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rubik 3D — Realistic Speedcube Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Top HUD -->
    <header>
      <h1 class="brand-title">Rubik 3D</h1>
      <p class="brand-subtitle">Realistic Speedcube Simulator</p>
      <div class="hud-stats">
        <div class="hud-item">
          <span class="hud-label">MOVES</span>
          <span class="hud-val" id="hud-moves">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">TIME</span>
          <span class="hud-val" id="hud-timer">00:00.00</span>
        </div>
      </div>
    </header>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Bottom Dock Controls -->
    <nav class="bottom-dock">
      <div class="dock-card">
        <div class="button-group">
          <button id="btn-scramble" class="primary" title="Shuffle Cube (Space)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
            </svg>
            Shuffle
          </button>
          <button id="btn-reset" title="Reset Solved State">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Reset
          </button>
          <button id="btn-undo" title="Undo Last Turn (Ctrl+Z)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14L4 9l5-5"/>
              <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
            </svg>
            Undo
          </button>
          <button id="btn-settings" class="icon-btn" title="Audio & Animation Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </button>
        </div>

        <!-- Notation Shortcut Row -->
        <div class="button-group notation-row">
          <button class="notation-btn" data-move="U">U</button>
          <button class="notation-btn" data-move="U'">U'</button>
          <button class="notation-btn" data-move="D">D</button>
          <button class="notation-btn" data-move="D'">D'</button>
          <button class="notation-btn" data-move="L">L</button>
          <button class="notation-btn" data-move="L'">L'</button>
          <button class="notation-btn" data-move="R">R</button>
          <button class="notation-btn" data-move="R'">R'</button>
          <button class="notation-btn" data-move="F">F</button>
          <button class="notation-btn" data-move="F'">F'</button>
          <button class="notation-btn" data-move="B">B</button>
          <button class="notation-btn" data-move="B'">B'</button>
        </div>

        <div class="hint-bar">
          Drag face to turn layer &bull; Drag outside to rotate &bull; Keys: <kbd>U</kbd> <kbd>D</kbd> <kbd>L</kbd> <kbd>R</kbd> <kbd>F</kbd> <kbd>B</kbd> (<kbd>Shift</kbd> for prime) &bull; <kbd>Ctrl+Z</kbd> Undo
        </div>
      </div>
    </nav>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 id="settings-heading" class="modal-title">Settings</h3>
          <button id="btn-close-settings" class="close-btn" aria-label="Close settings">&times;</button>
        </div>

        <div class="setting-row">
          <label for="setting-sound" class="setting-label">Mechanical Sound</label>
          <div class="setting-ctrl">
            <input type="checkbox" id="setting-sound" checked>
          </div>
        </div>

        <div class="setting-row">
          <label for="setting-volume" class="setting-label">Volume</label>
          <div class="setting-ctrl">
            <input type="range" id="setting-volume" min="0" max="100" value="60">
            <span id="val-volume" style="font-size:0.82rem; min-width:38px;">60%</span>
          </div>
        </div>

        <div class="setting-row">
          <label for="setting-speed" class="setting-label">Turn Speed</label>
          <div class="setting-ctrl">
            <input type="range" id="setting-speed" min="80" max="400" value="180">
            <span id="val-speed" style="font-size:0.82rem; min-width:44px;">180ms</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Solved Victory Modal -->
    <div id="win-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="win-heading">
      <div class="modal-dialog win-dialog">
        <h2 id="win-heading" class="win-title">Cube Solved!</h2>
        <div class="win-stats">
          <div class="win-stat-box">
            <div class="win-stat-val" id="win-time">00:00.00</div>
            <div class="win-stat-lbl">Time</div>
          </div>
          <div class="win-stat-box">
            <div class="win-stat-val" id="win-moves">0</div>
            <div class="win-stat-lbl">Moves</div>
          </div>
        </div>
        <div class="button-group">
          <button id="btn-play-again" class="primary">Play Again</button>
          <button id="btn-close-win">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/three.min.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/cubeState.js"></script>
  <script src="js/cube.js"></script>
  <script src="js/rotation.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/scramble.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
